plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = 'com.example'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = 'forge'
        url = 'https://files.minecraftforge.net/maven'
    }
}

ext.archivesName = "quimera-${version}.jar"

sourceCompatibility = JavaVersion.VERSION_17

dependencies {
    implementation fg.deobf('net.minecraftforge:forge:1.18.2-40.1.0')
    implementation fg.deobf('net.minecraft:client:1.18.2-20220404.173215')
    implementation fg.deobf('net.minecraft:server:1.18.2-20220404.173215')
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.ext.minecraft_version
}
